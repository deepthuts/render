version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin # Change to your timezone
      - TZ=Europe/Berlin
    build:
      context: .
      args:
        - N8N_VERSION=2.37.9 # Change this to your preferred version

volumes:
  n8n_data:
